name: Lint Files

# This workflow lints the docsapp directory
# And will trigger on push to *any* branch except main
on:
  push:
    branches-ignore:
      - master

jobs:
  lint-client:
    name: Lint App Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies, Lint, check Types
        run: |
          cd docsapp
          npm ci
          npm run lint
          npm run types:check

  test-app:
    name: Unit Tests
    needs: lint-client
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: v24.11.0
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: |
          cd docsapp
          npm ci

      - name: Test
        run: |
          cd docsapp
          npm test
