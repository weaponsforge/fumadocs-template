name: Run CI Tests

# This workflow lints, type-checks and tests the docsapp directory
# And will trigger on push to *any* branch except master
on:
  push:
    branches-ignore:
      - master

defaults:
  run:
    working-directory: docsapp

jobs:
  lint-app:
    name: Lint App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: docsapp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types Check
        run: npm run types:check

  test-app:
    name: Unit Tests
    needs: lint-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: docsapp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

  e2e-app:
    name: E2E Privacy Tests
    needs: lint-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: docsapp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: E2E Tests
        run: npm run test:e2e
